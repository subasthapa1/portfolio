<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Certifications | Subas Thapa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      background: #fafafa;
      color: #111;
      margin: 0;
      padding: 40px 60px;
    }

    /* Back Button */
    .back-btn {
      display: inline-block;
      margin-bottom: 30px;
      padding: 12px 20px;
      border: 2px solid #4db6ac;
      text-decoration: none;
      color: #4db6ac;
      font-weight: 600;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: #4db6ac;
      color: #fff;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #111;
    }

    ul {
      list-style: none;
      padding: 0;
      max-width: 600px;
    }

    ul li {
      background: #fff;
      padding: 16px 20px;
      margin-bottom: 15px;
      border-left: 5px solid #4db6ac;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      font-size: 16px;
      font-weight: 500;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        padding: 30px 20px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <!-- Back Button at Top -->
  <a href="index.html" class="back-btn">
    ← Back
  </a>

  <h1>
    <i class="fa fa-certificate" style="color:#4db6ac"></i>
    Certifications
  </h1>

  <ul>
    <li>ISTQB Certified Tester – Foundation Level</li>
    <li>Microsoft Power BI Data Analyst</li>
  </ul>

</body>
</html>
